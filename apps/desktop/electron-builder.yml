appId: gps.hx-engine.com
productName: Generative Protein System
executableName: gps
npmRebuild: false
directories:
  output: release
files:
  - dist/**/*
  - build/host/**/*
  - package.json
asarUnpack:
  - node_modules/@img/**
extraResources:
  - from: ../web/.next/standalone
    to: next
  - from: ../web/.next/standalone/node_modules
    to: next/node_modules
  - from: ../web/.next/static
    to: next/apps/web/.next/static
  - from: ../web/public
    to: next/apps/web/public
mac:
  target:
    - dmg
  category: public.app-category.productivity
linux:
  target:
    - AppImage
    - deb
  category: Science
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: gps_${version}_${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
deb:
  packageName: gps
  maintainer: zhonghua-wang <zhonghua.wang@outlook.com>
  artifactName: gps_${version}_${arch}.${ext}
